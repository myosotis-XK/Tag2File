<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag2File Mobile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="/static/assets/css/main.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <button class="btn btn-primary d-md-none" type="button" id="sidebar-toggle" aria-label="Toggle sidebar">
                <i class="fa fa-bars"></i>
            </button>
            <a class="navbar-brand" href="#">
                <i class="fa fa-tags mr-2"></i>Tag2File
            </a>

            <div class="dropdown ms-auto">
                <button class="btn btn-primary dropdown-toggle" type="button" id="settings-dropdown" data-bs-toggle="dropdown" aria-expanded="false" title="设置">
                    <i class="fa fa-cog"></i> </button>
                <ul class="dropdown-menu dropdown-menu-end p-2" aria-labelledby="settings-dropdown">
                    <li class="keep-open-on-click"> 
                        <span class="dropdown-item-text fw-bold">标签库:</span>
                        <div class="dropdown mb-2">
                            <button class="btn btn-sm btn-outline-secondary dropdown-toggle w-100" type="button" id="database-dropdown-inner" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fa fa-database me-1"></i>
                                <span id="current-db-name">标签库</span>
                            </button>
                            <ul class="dropdown-menu" aria-labelledby="database-dropdown-inner" id="db-list-menu">
                                <li class="dropdown-item text-muted">加载中...</li>
                            </ul>
                        </div>
                    </li>

                <li><hr class="dropdown-divider"></li>
                    
                    <li>
                        <span class="dropdown-item-text fw-bold">缩略图尺寸:</span>
                        <div class="btn-group btn-group-sm w-100 p-2" role="group" aria-label="Thumbnail size">
                            <button type="button" class="btn btn-outline-secondary size-btn" data-size="small" title="小尺寸">
                                <i class="fa fa-th-list"></i>
                            </button>
                            <button type="button" class="btn btn-outline-primary active size-btn" data-size="medium" title="中尺寸">
                                <i class="fa fa-th"></i>
                            </button>
                            <button type="button" class="btn btn-outline-secondary size-btn" data-size="large" title="大尺寸">
                                <i class="fa fa-th-large"></i>
                            </button>
                        </div>
                    </li>

                    <li><hr class="dropdown-divider"></li>
                    
                    <li>
                        <span class="dropdown-item-text fw-bold">排序方式:</span>
                        <div class="btn-group btn-group-sm w-100 p-2" role="group" aria-label="Sort options">
                            <button type="button" class="btn btn-outline-secondary sort-btn active" data-sort="name" title="按名称">
                                <i class="fa fa-font"></i>
                            </button>
                            <button type="button" class="btn btn-outline-secondary sort-btn" data-sort="date" title="按日期">
                                <i class="fa fa-calendar"></i>
                            </button>
                            <button type="button" class="btn btn-outline-secondary sort-btn" data-sort="size" title="按大小">
                                <i class="fa fa-file"></i>
                            </button>
                            <button type="button" class="btn btn-outline-secondary sort-btn" data-sort="random" title="随机">
                                <i class="fa fa-random"></i>
                            </button>
                        </div>
                    </li>
                    
                    <li>
                        <span class="dropdown-item-text fw-bold">排序顺序:</span>
                        <div class="btn-group btn-group-sm w-100 p-2" role="group" aria-label="Sort order">
                            <button type="button" class="btn btn-outline-secondary order-btn active" data-order="desc" title="降序">
                                <i class="fa fa-sort-desc"></i>
                            </button>
                            <button type="button" class="btn btn-outline-secondary order-btn" data-order="asc" title="升序">
                                <i class="fa fa-sort-asc"></i>
                            </button>
                        </div>
                    </li>

                    <li><hr class="dropdown-divider"></li>

                    <li>
                        <a class="dropdown-item text-danger" href="/logout">
                            <i class="fa fa-sign-out me-2"></i>登出
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="layout">
            <div class="sidebar">
                <div class="mb-1">
                    <div class="search-box">
                        <input 
                            type="text" 
                            id="search-input" 
                            class="form-control" 
                            placeholder="示例：风景 ∪ 人物"
                            autocomplete="off"
                        >
                        <span id="clear-search" class="clear-btn" title="清空">
                            <i class="fa fa-times"></i>
                        </span>
                    </div>
                    <div class="d-grid gap-2 mt-2">
                        <button id="search-btn" class="btn btn-primary">
                            <i class="fa fa-search mr-1"></i>查询
                        </button>
                    </div>
                </div>
                <div class="operator-buttons-container"> <button class="btn btn-secondary operator-btn">∩</button>
                    <button class="btn btn-secondary operator-btn">∪</button>
                    <button class="btn btn-secondary operator-btn">'</button>
                    <button class="btn btn-secondary operator-btn">(</button>
                    <button class="btn btn-secondary operator-btn">)</button>
                </div>
                
                <div id="tag-tree" class="tag-tree">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>加载标签列表中...</p>
                    </div>
                </div>
            </div>
            
            <div class="content">
                <div class="file-list">
                    <div id="results-container">
                        <div class="text-center text-muted py-5">
                            <i class="fa fa-search fa-3x mb-3"></i>
                            <p>输入集合表达式并点击查询按钮开始搜索</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="/static/js/main.js"></script>
</body>
</html>
