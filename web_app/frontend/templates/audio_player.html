<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>音频播放器 - Tag2File</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="/static/css/audio_player.css">
</head>
<body>
    <div class="audio-player-container">
        <!-- 顶部导航栏 -->
        <nav class="navbar">
            <button class="btn-back" id="btn-back">
                <i class="fa fa-arrow-left"></i>
            </button>
            <h1 class="navbar-title">音频播放器</h1>
            <div class="navbar-spacer"></div>
        </nav>

        <!-- 上方显示区域：封面/歌词切换 -->
        <div class="display-area" id="display-area">
            <!-- 封面视图 -->
            <div class="cover-view" id="cover-view">
                <img id="cover-image" src="" alt="封面" class="cover-image">
                <div class="track-info">
                    <h2 id="track-title">加载中...</h2>
                    <p id="track-artist">未知艺术家</p>
                </div>
            </div>

            <!-- 歌词视图 (默认隐藏) -->
            <div class="lyric-view" id="lyric-view" style="display: none;">
                <div class="lyric-container" id="lyric-container">
                    <p class="text-muted text-center">暂无歌词</p>
                </div>
            </div>
        </div>

        <!-- 进度条 -->
        <div class="progress-area">
            <span id="current-time" class="time-label">0:00</span>
            <input type="range" id="progress-slider" class="progress-slider" min="0" max="100" value="0">
            <span id="duration-time" class="time-label">0:00</span>
        </div>

        <!-- 播放控制按钮 -->
        <div class="controls-area">
            <button class="btn-control" id="btn-mode" title="播放模式">
                <i class="fa fa-retweet"></i>
            </button>
            <button class="btn-control" id="btn-rewind" title="后退3秒">
                <i class="fa fa-backward"></i>
            </button>
            <button class="btn-control btn-play" id="btn-play" title="播放">
                <i class="fa fa-play"></i>
            </button>
            <button class="btn-control" id="btn-forward" title="前进3秒">
                <i class="fa fa-forward"></i>
            </button>
            <button class="btn-control" id="btn-volume" title="音量">
                <i class="fa fa-volume-up"></i>
            </button>
        </div>

        <!-- 音量弹出面板 -->
        <div id="volume-popup" class="volume-popup" style="display: none;">
            <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="50" orient="vertical">
            <span id="volume-value" class="volume-value">50%</span>
        </div>

        <!-- 右下角菜单按钮 -->
        <button class="btn-sidebar-toggle" id="btn-sidebar-toggle" title="菜单">
            <i class="fa fa-bars"></i>
        </button>

        <!-- 侧边栏 (播放列表和标记) -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3 class="sidebar-title">菜单</h3>
                <button class="btn-sidebar-close" id="btn-sidebar-close">
                    <i class="fa fa-times"></i>
                </button>
            </div>

            <!-- 侧边栏标签页 -->
            <div class="sidebar-tabs">
                <button class="sidebar-tab-btn active" data-tab="playlist">
                    <i class="fa fa-list"></i> 播放列表
                </button>
                <button class="sidebar-tab-btn" data-tab="marker">
                    <i class="fa fa-bookmark"></i> 标记
                </button>
            </div>

            <!-- 侧边栏内容 -->
            <div class="sidebar-content">
                <!-- 播放列表面板 -->
                <div id="sidebar-playlist" class="sidebar-pane active">
                    <div id="playlist-container" class="playlist-container">
                        <p class="text-muted text-center">播放列表为空</p>
                    </div>
                </div>

                <!-- 标记面板 -->
                <div id="sidebar-marker" class="sidebar-pane">
                    <!-- 快速创建面板 -->
                    <div class="marker-quick-create">
                        <h6 class="quick-create-title">快速创建标记</h6>
                        <div class="quick-create-row">
                            <button class="btn btn-sm btn-primary" id="btn-mark-in">
                                <i class="fa fa-sign-in"></i> 入点
                            </button>
                            <input type="text" id="input-in-point" class="form-control form-control-sm" placeholder="00:00.00" readonly>
                        </div>
                        <div class="quick-create-row">
                            <button class="btn btn-sm btn-primary" id="btn-mark-out">
                                <i class="fa fa-sign-out"></i> 出点
                            </button>
                            <input type="text" id="input-out-point" class="form-control form-control-sm" placeholder="00:00.00" readonly>
                        </div>
                        <div class="quick-create-row">
                            <input type="text" id="input-marker-label" class="form-control form-control-sm" placeholder="标记名称">
                            <button class="btn btn-sm btn-outline-primary" id="btn-select-preset">
                                <i class="fa fa-tags"></i> 选择预设
                            </button>
                        </div>
                        <div class="quick-create-row">
                            <input type="color" id="input-marker-color" class="form-control form-control-sm form-control-color" value="#ff0000">
                        </div>
                        <div class="quick-create-row">
                            <button class="btn btn-sm btn-success" id="btn-create-marker">
                                <i class="fa fa-plus"></i> 创建
                            </button>
                            <button class="btn btn-sm btn-secondary" id="btn-clear-marker">
                                <i class="fa fa-eraser"></i>
                            </button>
                        </div>

                        <!-- 预设选择弹窗 -->
                        <div class="preset-popup-overlay" id="preset-popup-overlay" style="display: none;">
                            <div class="preset-popup" id="preset-popup">
                                <div class="preset-popup-header">
                                    <h5>选择预设类型</h5>
                                    <button class="btn-close-preset" id="btn-close-preset">
                                        <i class="fa fa-times"></i>
                                    </button>
                                </div>
                                <div class="preset-grid" id="preset-grid">
                                    <p class="text-muted text-center">暂无预设</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 标记列表 -->
                    <div class="marker-list-header">
                        <h6>标记列表</h6>
                    </div>
                    <div id="marker-list" class="marker-list">
                        <p class="text-muted text-center">暂无标记</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 侧边栏遮罩层 -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 播放器脚本 (ES6 模块) -->
    <script type="module">
        import { AudioPlayerController } from '/static/js/features/audioPlayer.js';

        // 初始化播放器
        window.addEventListener('DOMContentLoaded', () => {
            const player = new AudioPlayerController();
            window.audioPlayer = player; // 调试用
        });
    </script>
</body>
</html>
